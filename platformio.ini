; agri-uv-poe — M5Stack ATOM PoE UV Index node
;
; Hardware
;   - M5Stack ATOM Lite (ESP32-PICO-D4) + ATOM PoE Base (W5500 on SPI)
;   - DFRobot Gravity UV Index Sensor SEN0636 in UART mode (mode switch → UART)
;
; Wiring (ATOM Grove / UART2 → sensor 4-pin)
;   G26 (RX) ← sensor pin2 (C/T = sensor TX)
;   G32 (TX) → sensor pin1 (D/R = sensor RX)
;   5V        → sensor pin3
;   GND       → sensor pin4
;
; Protocol: Modbus RTU, 9600 8N1, slave 0x23
;   input reg 0x06 = UV raw (mV, 0-3300)
;   input reg 0x07 = UV Index (0-11)
;   input reg 0x08 = Risk Level (0-4 = Low/Moderate/High/Very High/Extreme)

[env:m5atom-poe]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38
board = m5stack-atom
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=0

; Strips the bogus `#include "String.h"` in the DFRobot UV library once
; the deps are fetched — see patch_dfrobot.py.
extra_scripts = pre:patch_dfrobot.py

lib_deps =
	https://github.com/yasunorioi/agri-node-poe-core.git
	https://github.com/DFRobot/DFRobot_RTU.git
	https://github.com/DFRobot/DFRobot_UVIndex240370Sensor.git
